{% extends "base.html" %} {% block title %}Add Product{%endblock %} {% block
content %}
<div class="form-container">
  <h1>Add New Product</h1>
  <form method="POST" class="product-form">
    <div class="form-group">
      <label for="name">Product Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        placeholder="Enter product name"
        maxlength="100"
      />
      <small>Max length 20 char</small>
    </div>

    <div class="form-group">
      <label for="price">Product Price</label>
      <input
        type="number"
        id="price"
        name="price"
        required
        placeholder="Enter price"
        step="0.01"
        min="0"
      />
      <small>Enter a postive number</small>
    </div>

    <div class="form-group">
      <label for="description">Product Details</label>
      <textarea
        id="description"
        name="description"
        required
        placeholder="Enter product details"
        rows="6"
        maxlength="500"
      ></textarea>
      <small>Max length 500 char</small>
    </div>

    <div class="form-group">
      <label for="image">Product Image</label>
      <input
        type="text"
        id="image"
        name="image"
        placeholder="Select product image"
      />
      <small>If don't shoose an image , the default image will be used</small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Add</button>
      <a href="{{ url_for('index') }}" class="btn btn-outline btn-lg">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
