{% extends "base.html" %}
<!-- {% block title %}Edit{{ product.name }} - Product Store{% endblock %} -->
{% block content %}
<div class="form-container">
  <h1>Edit Product</h1>
  <form method="POST" class="product-form">
    <div class="form-group">
      <label for="name">Product Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        placeholder="Enter product name"
        maxlength="20"
        value="{{ product.name }}"
      />
      <small>Max length 20 char</small>
    </div>

    <div class="form-group">
      <label for="price">Product Price</label>
      <input
        type="number"
        id="price"
        name="price"
        required
        placeholder="Enter price"
        step="0.01"
        min="0"
        value="{{ product.price }}"
      />
      <small>Enter a postive number</small>
    </div>

    <div class="form-group">
      <label for="description">Product Details</label>
      <textarea
        id="description"
        name="description"
        required
        placeholder="Enter product details"
        rows="6"
        maxlength="500"
      >
{{ product.description }}</textarea
      >
      <small>Max length 500 char</small>
    </div>

    <div class="form-group">
      <label for="image">Product Image</label>
      <input
        type="text"
        id="image"
        name="image"
        placeholder="أدخل رابط الصورة"
        value="{{ product.image }}"
      />
      <small>Select product image</small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
      <a
        href="{{ url_for('product_detail', product_id=product.id) }}"
        class="btn btn-outline btn-lg"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %}
