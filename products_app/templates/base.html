<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Product Store App{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-brand">
          <a href="{{ url_for('index') }}">Product Store</a>
        </div>
        <ul class="nav-menu">
          <li>
            <a href="{{ url_for('add_product') }}" class="nav-link btn-add"
              >Add Product</a
            >
          </li>
        </ul>
      </div>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
    <footer class="footer">
      <p>&copy; Product Store App. All rights reserved 2025</p>
    </footer>
  </body>
</html>
